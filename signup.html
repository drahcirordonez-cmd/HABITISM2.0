<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABITISM • Create Your Account</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9333ea">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background-color: var(--dark-bg, #010113);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-y: auto;
    }

    .signup-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: rgba(18, 14, 38, 0.75);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: clamp(1.8rem, 4vw, 2.4rem);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(147, 51, 234, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInScale 0.45s ease-out;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.86rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }

    .form-group input {
      width: 100%;
      padding: 11px 15px;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 11px;
      outline: none;
      transition: all 0.22s ease;
      box-sizing: border-box;
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .form-group input.is-invalid {
      border-color: #f87171 !important;
      background: rgba(239, 68, 68, 0.09) !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
    }

    .field-error {
      color: #f87171;
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.35;
      display: none;
      margin-top: 3px;
    }

    .field-error.visible {
      display: block;
      animation: fieldErrorFade 0.2s ease-out;
    }

    @keyframes fieldErrorFade {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(147, 51, 234, 0.45);
      transition: all 0.25s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(147, 51, 234, 0.65);
      filter: brightness(1.1);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .auth-error {
      color: #f87171;
      font-size: 0.85rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ambient background glow layers -->
  <div class="night"></div>
  <div class="ambient-glow"></div>

  <div class="signup-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <a href="introduction-page.html" class="brand-logo" style="justify-content: center; margin-bottom: 8px;">
        <div class="brand-icon">🌸</div>
        <span style="font-size: 1.45rem;">HABITISM</span>
      </a>
      <h2 style="font-size: 1.5rem; font-weight: 800; margin: 4px 0; color: #ffffff;">Create Your Account</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 0;">Begin your journey to ironclad consistency</p>
    </div>

    <div class="auth-error" id="signupError"></div>

    <!-- Official Habitism Facebook Community Link -->
    <a href="https://www.facebook.com/1496888330165860" target="_blank" rel="noopener noreferrer" class="btn-facebook" id="btnFacebookPageLink" title="Visit the Habitism Facebook Community Page" style="width: 100%; margin-bottom: 14px; text-decoration: none; padding: 12px 16px;">
      <svg width="20" height="20" fill="#ffffff" viewBox="0 0 24 24" style="flex-shrink: 0;"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span style="font-size: 0.88rem; line-height: 1.3;">Track your progress in The Habitism Facebook page along with other users ↗</span>
    </a>

    <div style="display: flex; align-items: center; text-align: center; margin: 10px 0 16px; color: var(--text-muted, #94a3b8); font-size: 0.8rem;">
      <span style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.12);"></span>
      <span style="padding: 0 10px;">or create your Habitism account</span>
      <span style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.12);"></span>
    </div>

    <form id="signupForm" novalidate onsubmit="handleSignupSubmit(event)">
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="e.g. John Doe" autocomplete="name">
        <div class="field-error" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" placeholder="e.g. johndoe" autocomplete="username">
        <div class="field-error" id="usernameError"></div>
      </div>

      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="john@example.com" autocomplete="email">
        <div class="field-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 8 characters" autocomplete="new-password">
        <div class="field-error" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label for="signupConfirmPassword">Confirm Password</label>
        <input type="password" id="signupConfirmPassword" placeholder="Re-enter password" autocomplete="new-password">
        <div class="field-error" id="confirmPasswordError"></div>
      </div>

      <button type="submit" class="btn-submit" id="btnSignupText">Create My Account & Continue →</button>
    </form>

    <div style="margin-top: 18px; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? 
      <a href="login.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">Log In here</a>
    </div>
  </div>

  <script src="app.js?v=2.4"></script>
  <script>
    // -------------------------------------------------------------
    // Inline Field Validation Helpers
    // -------------------------------------------------------------
    function setFieldError(fieldId, errorId, errorMsg) {
      const input = document.getElementById(fieldId);
      const err = document.getElementById(errorId);
      if (!input || !err) return;
      if (errorMsg) {
        input.classList.add("is-invalid");
        err.innerText = errorMsg;
        err.classList.add("visible");
      } else {
        input.classList.remove("is-invalid");
        err.innerText = "";
        err.classList.remove("visible");
      }
    }

    // Name field validation:
    // - Allowed: letters (a-z, A-Z), spaces, hyphens, apostrophes, periods.
    // - Blocked: numbers, special characters (@#$% etc.).
    // - Error: "Name cannot contain numbers or special characters."
    function validateName(value) {
      const name = (value || '').trim();
      if (!name) {
        return "Name is required.";
      }
      const allowedRegex = /^[a-zA-Z\s\-'.]+$/;
      if (!allowedRegex.test(name) || !/[a-zA-Z]/.test(name)) {
        return "Name cannot contain numbers or special characters.";
      }
      return "";
    }

    // Username validation
    function validateUsername(value) {
      const username = (value || '').trim();
      if (!username) {
        return "Username is required.";
      }
      if (username.length < 3) {
        return "Username must be at least 3 characters.";
      }
      if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
        return "Username can only contain letters, numbers, underscores, and hyphens.";
      }
      return "";
    }

    // Email field validation:
    // - Must contain one @.
    // - Local part: letters, numbers, dots, underscores, hyphens.
    // - Domain: must contain at least one dot and a TLD of 2+ letters (.com, .org, etc.).
    // - Reject consecutive dots, leading/trailing dots, spaces.
    // - Errors: specify exactly what's missing.
    function validateEmail(value) {
      const raw = value || '';
      if (!raw.trim()) {
        return "Email address is required.";
      }
      if (/\s/.test(raw)) {
        return "Email cannot contain spaces.";
      }
      const email = raw.trim();

      const atMatches = email.match(/@/g);
      if (!atMatches || atMatches.length === 0) {
        return "Email must contain an '@' symbol.";
      }
      if (atMatches.length > 1) {
        return "Email can only contain one '@' symbol.";
      }

      if (email.includes('..')) {
        return "Email cannot contain consecutive dots.";
      }

      const atIndex = email.indexOf('@');
      const localPart = email.slice(0, atIndex);
      const domain = email.slice(atIndex + 1);

      if (!localPart) {
        return "Email is missing a username before '@'.";
      }
      if (!domain) {
        return "Email is missing a domain after '@' (e.g., example.com).";
      }

      if (localPart.startsWith('.') || localPart.endsWith('.')) {
        return "Email username cannot start or end with a dot.";
      }

      if (!/^[a-zA-Z0-9._-]+$/.test(localPart)) {
        return "Email username can only contain letters, numbers, dots, underscores, and hyphens.";
      }

      if (domain.startsWith('.') || domain.endsWith('.')) {
        return "Email domain cannot start or end with a dot.";
      }

      if (!domain.includes('.')) {
        return "Email domain must contain at least one dot (e.g., example.com).";
      }

      const domainParts = domain.split('.');
      const tld = domainParts[domainParts.length - 1];

      for (let i = 0; i < domainParts.length - 1; i++) {
        const part = domainParts[i];
        if (!part) {
          return "Email domain contains an empty segment.";
        }
        if (!/^[a-zA-Z0-9-]+$/.test(part)) {
          return "Email domain contains invalid characters.";
        }
        if (part.startsWith('-') || part.endsWith('-')) {
          return "Email domain segments cannot start or end with a hyphen.";
        }
      }

      if (!/^[a-zA-Z]{2,}$/.test(tld)) {
        return "Email must include a valid top-level domain like .com";
      }

      return "";
    }

    // Password validation: Minimum 8 characters
    function validatePassword(value) {
      const password = value || '';
      if (!password) {
        return "Password is required.";
      }
      if (password.length < 8) {
        return "Password must be at least 8 characters.";
      }
      return "";
    }

    // Confirm Password validation: Must match password
    function validateConfirmPassword(confirmVal, passwordVal) {
      const confirm = confirmVal || '';
      if (!confirm) {
        return "Please confirm your password.";
      }
      if (confirm !== passwordVal) {
        return "Passwords do not match.";
      }
      return "";
    }

    // -------------------------------------------------------------
    // Attach Blur and Input Listeners
    // -------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const nameInput = document.getElementById("signupName");
      const usernameInput = document.getElementById("signupUsername");
      const emailInput = document.getElementById("signupEmail");
      const passwordInput = document.getElementById("signupPassword");
      const confirmInput = document.getElementById("signupConfirmPassword");

      // Name events
      nameInput.addEventListener("blur", () => {
        setFieldError("signupName", "nameError", validateName(nameInput.value));
      });
      nameInput.addEventListener("input", () => {
        if (nameInput.classList.contains("is-invalid")) {
          setFieldError("signupName", "nameError", validateName(nameInput.value));
        }
      });

      // Username events
      usernameInput.addEventListener("blur", async () => {
        const err = validateUsername(usernameInput.value);
        setFieldError("signupUsername", "usernameError", err);
        if (!err && typeof Habitism !== 'undefined' && Habitism.checkAvailability) {
          const res = await Habitism.checkAvailability(usernameInput.value.trim(), null);
          if (res && !res.available && res.field === 'username') {
            setFieldError("signupUsername", "usernameError", "This username/email is already registered.");
          }
        }
      });
      usernameInput.addEventListener("input", () => {
        if (usernameInput.classList.contains("is-invalid")) {
          setFieldError("signupUsername", "usernameError", validateUsername(usernameInput.value));
        }
      });

      // Email events
      emailInput.addEventListener("blur", async () => {
        const err = validateEmail(emailInput.value);
        setFieldError("signupEmail", "emailError", err);
        if (!err && typeof Habitism !== 'undefined' && Habitism.checkAvailability) {
          const res = await Habitism.checkAvailability(null, emailInput.value.trim());
          if (res && !res.available && res.field === 'email') {
            setFieldError("signupEmail", "emailError", "This username/email is already registered.");
          }
        }
      });
      emailInput.addEventListener("input", () => {
        if (emailInput.classList.contains("is-invalid")) {
          setFieldError("signupEmail", "emailError", validateEmail(emailInput.value));
        }
      });

      // Password events
      passwordInput.addEventListener("blur", () => {
        setFieldError("signupPassword", "passwordError", validatePassword(passwordInput.value));
        if (confirmInput.value) {
          setFieldError("signupConfirmPassword", "confirmPasswordError", validateConfirmPassword(confirmInput.value, passwordInput.value));
        }
      });
      passwordInput.addEventListener("input", () => {
        if (passwordInput.classList.contains("is-invalid")) {
          setFieldError("signupPassword", "passwordError", validatePassword(passwordInput.value));
        }
        if (confirmInput.value && confirmInput.classList.contains("is-invalid")) {
          setFieldError("signupConfirmPassword", "confirmPasswordError", validateConfirmPassword(confirmInput.value, passwordInput.value));
        }
      });

      // Confirm Password events
      confirmInput.addEventListener("blur", () => {
        setFieldError("signupConfirmPassword", "confirmPasswordError", validateConfirmPassword(confirmInput.value, passwordInput.value));
      });
      confirmInput.addEventListener("input", () => {
        if (confirmInput.classList.contains("is-invalid")) {
          setFieldError("signupConfirmPassword", "confirmPasswordError", validateConfirmPassword(confirmInput.value, passwordInput.value));
        }
      });
    });

    // -------------------------------------------------------------
    // Form Submission Handler
    // -------------------------------------------------------------
    async function handleSignupSubmit(e) {
      e.preventDefault();

      const nameInput = document.getElementById("signupName");
      const usernameInput = document.getElementById("signupUsername");
      const emailInput = document.getElementById("signupEmail");
      const passwordInput = document.getElementById("signupPassword");
      const confirmInput = document.getElementById("signupConfirmPassword");
      const topErrorEl = document.getElementById("signupError");
      const btn = document.getElementById("btnSignupText");

      topErrorEl.style.display = "none";
      topErrorEl.innerText = "";

      // Validate all fields
      const nameErr = validateName(nameInput.value);
      const usernameErr = validateUsername(usernameInput.value);
      const emailErr = validateEmail(emailInput.value);
      const passwordErr = validatePassword(passwordInput.value);
      const confirmErr = validateConfirmPassword(confirmInput.value, passwordInput.value);

      setFieldError("signupName", "nameError", nameErr);
      setFieldError("signupUsername", "usernameError", usernameErr);
      setFieldError("signupEmail", "emailError", emailErr);
      setFieldError("signupPassword", "passwordError", passwordErr);
      setFieldError("signupConfirmPassword", "confirmPasswordError", confirmErr);

      // Block account creation if any field is invalid
      if (nameErr || usernameErr || emailErr || passwordErr || confirmErr) {
        if (nameErr) nameInput.focus();
        else if (usernameErr) usernameInput.focus();
        else if (emailErr) emailInput.focus();
        else if (passwordErr) passwordInput.focus();
        else if (confirmErr) confirmInput.focus();
        return;
      }

      btn.disabled = true;
      btn.innerText = "Creating Account...";

      try {
        const user = await Habitism.register(
          nameInput.value.trim(),
          usernameInput.value.trim(),
          emailInput.value.trim(),
          passwordInput.value
        );
        // On success, redirect to /rules.html
        window.location.href = "/rules.html";
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Create My Account & Continue →";

        const errMsg = err.message || "Registration failed. Please try again.";
        if (errMsg.includes("already registered") || errMsg.includes("already taken")) {
          const isEmail = (err.field === 'email') || errMsg.toLowerCase().includes('email');
          const isUser = (err.field === 'username') || errMsg.toLowerCase().includes('username');

          const conflictMsg = "This username/email is already registered.";
          if (isEmail && !isUser) {
            setFieldError("signupEmail", "emailError", conflictMsg);
            emailInput.focus();
          } else if (isUser && !isEmail) {
            setFieldError("signupUsername", "usernameError", conflictMsg);
            usernameInput.focus();
          } else {
            setFieldError("signupEmail", "emailError", conflictMsg);
            setFieldError("signupUsername", "usernameError", conflictMsg);
            emailInput.focus();
          }
          topErrorEl.innerText = conflictMsg;
          topErrorEl.style.display = "block";
        } else {
          topErrorEl.innerText = errMsg;
          topErrorEl.style.display = "block";
        }
      }
    }

    function handleFacebookSignup() {
      window.open('https://www.facebook.com/1496888330165860', '_blank', 'noopener,noreferrer');
    }

    // Process Facebook OAuth Redirect Return
    window.addEventListener("DOMContentLoaded", async () => {
      if (window.location.hash.includes('access_token=') || window.location.search.includes('error=')) {
        const errorEl = document.getElementById("signupError");
        if (errorEl) {
          errorEl.innerText = 'Connecting with Facebook...';
          errorEl.style.display = 'block';
          errorEl.style.color = '#38bdf8';
          errorEl.style.borderColor = 'rgba(56, 189, 248, 0.4)';
          errorEl.style.background = 'rgba(56, 189, 248, 0.12)';
        }

        try {
          const user = await Habitism.checkFacebookRedirectCallback();
          if (user) {
            if (user.role === 'admin') {
              window.location.href = 'admin.html';
            } else if (!user.committed) {
              window.location.href = 'rules.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }
        } catch (err) {
          if (errorEl) {
            errorEl.innerText = err.message;
            errorEl.style.display = 'block';
            errorEl.style.color = '#f87171';
            errorEl.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            errorEl.style.background = 'rgba(239, 68, 68, 0.12)';
          }
        }
      }
    });
  </script>
  <script>
    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[Habitism PWA] Service Worker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('[Habitism PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
