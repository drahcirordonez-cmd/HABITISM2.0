<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABITISM • Log In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Flower bouquet positioned on the right side */
    .flowers {
      position: absolute;
      left: 70%;
      bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
      z-index: 10;
    }

    .login-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      gap: 18px;
      z-index: 1002;
      overflow-y: auto;
    }

    .login-card {
      width: 92%;
      max-width: 480px;
      background: rgba(18, 14, 38, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 28px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(168, 85, 247, 0.18) inset;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 12px;
    }

    .auth-tab {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.35);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.86rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }

    .form-group input {
      width: 100%;
      padding: 11px 15px;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(147, 51, 234, 0.45);
      transition: all 0.22s ease;
      margin-top: 4px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(147, 51, 234, 0.65);
      filter: brightness(1.1);
    }

    .auth-error {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    @media (max-width: 768px) {
      .flowers {
        left: 50%;
        transform: scale(0.72);
      }
      .login-wrapper {
        left: 0;
        right: 0;
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

  <div class="login-wrapper">

        <div class="brand-icon">🌸</div>
        <span style="font-size: 1.5rem;">HABITISM</span>

      <p style="font-size: 0.88rem; color: var(--text-secondary);">Your Life-Changing Journey Begins Here</p>

    <div class="login-card">

      <button class="btn-facebook" onclick="handleFacebookLogin()">

        <span>Continue with Facebook</span>
      </button>

      <div class="divider">or continue with email</div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Log In</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthMode('register')">Register</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <!-- Auth Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="groupName" style="display: none;">
          <label>Full Name</label>
          <input type="text" id="authName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit" id="btnSubmitText">Log In to Habitism</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener("load", () => {
      document.body.classList.remove("container");
    });

    let authMode = 'login';

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('groupName').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('btnSubmitText').innerText = mode === 'register' ? 'Create My Account' : 'Log In to Habitism';
      document.getElementById('authError').style.display = 'none';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const name = document.getElementById('authName').value.trim();
      const errEl = document.getElementById('authError');
      errEl.style.display = 'none';

      try {
        let user;
        if (authMode === 'register') {
          if (!name) throw new Error('Please enter your name.');
          user = await Habitism.register(name, email, password);
        } else {
          user = await Habitism.login(email, password);
        }

        // Check if user has already committed to the rules
        if (user.committed) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'rules.html';
        }
      } catch (err) {
        errEl.innerText = err.message;
        errEl.style.display = 'block';
      }
    }

    async function handleFacebookLogin() {
      const fbName = prompt('Enter your Facebook profile name for verification:', 'Accountability Champion') || 'Facebook User';
      const user = await Habitism.facebookLogin(fbName);
      
      // Always redirect to rules page on Facebook login for policy commitment!
      if (!user.committed) {
        window.location.href = 'rules.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
