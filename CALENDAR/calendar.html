<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Calendar</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    /* Flower bouquet positioned on the left side */
    .flowers {
      position: absolute;
      left: 30%;
      bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
      z-index: 10;
    }

    /* Background overlay on right side */
    .calendar-background {
      position: absolute;
      left: 38%;
      top: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(to left, rgba(1, 1, 19, 0.35) 0%, rgba(1, 1, 19, 0.08) 65%, transparent 100%);
      z-index: 1001;
      pointer-events: none;
    }

    /* Main Container on right side */
    .calendar-container {
      position: absolute;
      left: 40%;
      top: 0;
      bottom: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      gap: clamp(14px, 2.2vh, 22px);
      z-index: 1002;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* Top Header Banner */
    .header {
      text-align: center;
      font-size: clamp(1.25rem, 2vw + 0.3rem, 2rem);
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(79, 70, 229, 0.18));
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 14px 22px;
      border-radius: 16px;
      width: 92%;
      max-width: 520px;
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      box-sizing: border-box;
    }

    /* Frosted Glass Calendar Card */
    .calendar-card {
      position: relative;
      width: 92%;
      max-width: 520px;
      background: rgba(18, 14, 38, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 24px 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(168, 85, 247, 0.18) inset;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1002;
      color: #f1f5f9;
      box-sizing: border-box;
    }

    /* Navigation & Month-Year Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    #monthYear {
      font-size: clamp(1.15rem, 1.8vw, 1.45rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      letter-spacing: -0.01em;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .nav-buttons button {
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
      transition: all 0.25s ease;
    }

    .nav-buttons button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.55);
      filter: brightness(1.1);
    }

    .nav-buttons button:active {
      transform: translateY(0);
    }

    /* Calendar Grid */
    #calendar {
      width: 100%;
      border-collapse: separate;
      border-spacing: 6px;
      margin: 4px auto 0;
      table-layout: fixed;
    }

    #calendar th {
      color: #c4b5fd;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 0;
      text-align: center;
      border: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #calendar td {
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #f1f5f9;
      font-weight: 500;
      font-size: 0.95rem;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
      box-sizing: border-box;
    }

    #calendar td:empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    #calendar td:not(:empty):hover {
      background: rgba(168, 85, 247, 0.28);
      border-color: #a855f7;
      transform: scale(1.08);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.45);
      color: #ffffff;
    }

    /* Today's date marker */
    #calendar td.today {
      border: 2px solid #c084fc;
      background: rgba(192, 132, 252, 0.22);
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }

    /* Streak / Active habit day */
    #calendar td.streak {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #34d399;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.55);
    }

    #calendar td.today.streak {
      border: 2px solid #facc15;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.5), 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Streak Badge & Legend */
    .streak-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    #streakDisplay {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 50px;
      padding: 7px 16px;
      color: #6ee7b7;
      font-weight: 600;
      font-size: 0.92rem;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .legend-text {
      font-size: 0.82rem;
      color: #c4b5fd;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    /* Mobile Responsive View */
    @media (max-width: 768px) {
      .flowers {
        left: 50%;
        transform: scale(0.72);
      }

      .calendar-background {
        left: 0;
        right: 0;
        background: rgba(1, 1, 19, 0.25);
        backdrop-filter: blur(2px);
      }

      .calendar-container {
        left: 0;
        right: 0;
        padding: 1.2rem 0.8rem;
        gap: 14px;
      }

      .header {
        width: 95%;
        max-width: 440px;
        font-size: 1.25rem;
        padding: 12px 16px;
      }

      .calendar-card {
        width: 95%;
        max-width: 440px;
        padding: 18px 14px;
      }

      #calendar {
        border-spacing: 4px;
      }

      #calendar td {
        height: 38px;
        font-size: 0.88rem;
      }

      .streak-container {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>

  <script>
    window.addEventListener("load", () => {
      document.body.classList.remove("container");
    });

    let currentDate = new Date();

    function renderCalendar(date) {
      const calendar = document.getElementById("calendar");
      const year = date.getFullYear();
      const month = date.getMonth();

      document.getElementById("monthYear").innerText =
        date.toLocaleString("default", { month: "long" }) + " " + year;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = "<tr>";
      const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      for (let d of days) html += "<th>" + d + "</th>";
      html += "</tr><tr>";

      for (let i = 0; i < firstDay; i++) {
        html += "<td></td>";
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const today = new Date();
        const cellDate = new Date(year, month, day).toDateString();
        let classes = "";

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          classes += "today ";
        }
        if (localStorage.getItem(cellDate) === "used") classes += "streak ";

        html += `<td class="${classes}" onclick="toggleDay('${cellDate}')">${day}</td>`;
        if ((day + firstDay) % 7 === 0) html += "</tr><tr>";
      }

      html += "</tr>";
      calendar.innerHTML = html;
      updateStreak();
    }

    function toggleDay(cellDate) {
      if (localStorage.getItem(cellDate) === "used") {
        localStorage.removeItem(cellDate);
      } else {
        localStorage.setItem(cellDate, "used");
      }
      updateStreak();
      renderCalendar(currentDate);
    }

    function updateStreak() {
      let streak = 0;
      let today = new Date();
      for (let i = 0; i < 30; i++) {
        let checkDate = new Date(today);
        checkDate.setDate(today.getDate() - i);
        if (localStorage.getItem(checkDate.toDateString()) === "used") {
          streak++;
        } else {
          break;
        }
      }
      document.getElementById("streakDisplay").innerHTML = `🔥 Streak: ${streak} ${streak === 1 ? 'day' : 'days'}`;
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar(currentDate);
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar(currentDate);
    }

    renderCalendar(currentDate);
  </script>
