services:
  - type: web
    name: habitism-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: habitism-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: FB_APP_ID
        value: 992807423129946
      - key: FB_PAGE_ID
        value: 1496888330165860
      - key: FB_PAGE_NAME
        value: Habitism
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true


