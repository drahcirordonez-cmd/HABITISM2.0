<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABITISM • User Feedback</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9333ea">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background-color: var(--dark-bg, #010113);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-y: auto;
      position: relative;
    }

    .feedback-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      background: rgba(18, 14, 38, 0.78);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: clamp(1.8rem, 4vw, 2.4rem);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(147, 51, 234, 0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInScale 0.45s ease-out;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 0.86rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 15px;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 11px;
      outline: none;
      transition: all 0.22s ease;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group select {
      background: #0f172a;
      cursor: pointer;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .field-hint {
      font-size: 0.76rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .field-error {
      color: #f87171;
      font-size: 0.82rem;
      font-weight: 500;
      display: none;
      margin-top: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(147, 51, 234, 0.45);
      transition: all 0.25s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(147, 51, 234, 0.65);
      filter: brightness(1.1);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Success Card */
    .success-card {
      display: none;
      text-align: center;
      padding: 12px 4px;
      animation: fadeInScale 0.4s ease-out;
    }

    .success-icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.18);
      border: 2px solid rgba(16, 185, 129, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
    }

    /* Toast Notification */
    .habit-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.3);
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .habit-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Ambient background glow layers -->
  <div class="night"></div>
  <div class="ambient-glow"></div>

  <!-- Toast -->
  <div id="habitToast" class="habit-toast">Thank you for your feedback!</div>

  <div class="feedback-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <a href="dashboard.html" class="brand-logo" style="justify-content: center; margin-bottom: 8px; text-decoration: none;">
        <div class="brand-icon">🌸</div>
        <span style="font-size: 1.45rem; color: #ffffff; font-weight: 800;">HABITISM</span>
      </a>
      <h2 style="font-size: 1.45rem; font-weight: 800; margin: 6px 0 4px; color: #ffffff;">User Feedback</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary, #94a3b8); margin: 0;">Help us improve Habitism with your ideas, concerns, or bug reports</p>
    </div>

    <!-- Form -->
    <form id="standaloneFeedbackForm" onsubmit="handleStandaloneFeedbackSubmit(event)">
      <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;" class="form-group">
          <label for="fName">
            <span>👤</span>
            <span>Name <small style="color: #64748b; font-weight: 400;">(optional)</small></span>
          </label>
          <input type="text" id="fName" placeholder="Your name">
        </div>
        <div style="flex: 1; min-width: 200px;" class="form-group">
          <label for="fEmail">
            <span>✉️</span>
            <span>Email <small style="color: #64748b; font-weight: 400;">(optional)</small></span>
          </label>
          <input type="email" id="fEmail" placeholder="Your email address">
        </div>
      </div>

      <div class="form-group">
        <label for="fType">
          <span>🏷️</span>
          <span>Feedback Type <small style="color: #f87171;">*</small></span>
        </label>
        <select id="fType">
          <option value="Idea">💡 Idea / Feature Suggestion</option>
          <option value="Concern">⚠️ Concern / General Question</option>
          <option value="Bug Report">🐛 Bug Report / Technical Issue</option>
        </select>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="fMessage">
            <span>📝</span>
            <span>Message <small style="color: #f87171;">*</small></span>
          </label>
          <span style="font-size: 0.74rem; color: #94a3b8;"><span id="fCharCount">0</span> / 1000</span>
        </div>
        <textarea id="fMessage" rows="5" maxlength="1000" placeholder="Describe your idea, report an issue, or tell us what you think..." required></textarea>
        <div id="fError" class="field-error"></div>
      </div>

      <button type="submit" class="btn-submit" id="fSubmitBtn">
        <span>Submit Feedback</span>
        <span>→</span>
      </button>
    </form>

    <!-- Success View -->
    <div class="success-card" id="fSuccessView">
      <div class="success-icon-badge">✨</div>
      <h3 style="font-size: 1.35rem; font-weight: 800; color: #ffffff; margin-bottom: 8px;">Thank You!</h3>
      <p style="font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;">
        Thank you for your feedback! Your submission has been received and will be reviewed by the Habitism team.
      </p>
      <a href="dashboard.html" class="btn-submit" style="text-decoration: none;">
        <span>Return to Dashboard</span>
        <span>→</span>
      </a>
    </div>

    <div id="fFooter" style="margin-top: 18px; text-align: center; font-size: 0.88rem; color: var(--text-muted, #94a3b8);">
      <a href="dashboard.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">← Back to Dashboard</a>
    </div>
  </div>

  <script src="app.js?v=2.6"></script>
  <script>
    function showToast(text) {
      const toast = document.getElementById("habitToast");
      if (!toast) return;
      toast.innerText = text;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const user = Habitism.getCurrentUser();
      if (user) {
        if (user.name) document.getElementById("fName").value = user.name;
        if (user.email) document.getElementById("fEmail").value = user.email;
      }

      const msgInput = document.getElementById("fMessage");
      const charCounter = document.getElementById("fCharCount");
      if (msgInput && charCounter) {
        msgInput.addEventListener("input", () => {
          charCounter.innerText = msgInput.value.length;
        });
      }
    });

    async function handleStandaloneFeedbackSubmit(e) {
      e.preventDefault();
      const name = (document.getElementById("fName").value || "").trim();
      const email = (document.getElementById("fEmail").value || "").trim();
      const type = document.getElementById("fType").value || "Idea";
      const message = (document.getElementById("fMessage").value || "").trim();
      const errEl = document.getElementById("fError");
      const submitBtn = document.getElementById("fSubmitBtn");

      if (!message) {
        errEl.innerText = "Please enter your message.";
        errEl.style.display = "block";
        return;
      }

      if (message.length > 1000) {
        errEl.innerText = "Message cannot exceed 1000 characters.";
        errEl.style.display = "block";
        return;
      }

      errEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerHTML = "<span>Submitting...</span>";

      try {
        await Habitism.submitFeedback({
          name: name || null,
          email: email || null,
          type,
          message
        });

        showToast("Thank you for your feedback!");

        document.getElementById("standaloneFeedbackForm").style.display = "none";
        document.getElementById("fFooter").style.display = "none";
        document.getElementById("fSuccessView").style.display = "block";
      } catch (err) {
        errEl.innerText = err.message || "Failed to submit feedback.";
        errEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Submit Feedback</span><span>→</span>";
      }
    }
  </script>
</body>
</html>
