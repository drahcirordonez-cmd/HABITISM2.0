<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Flowers</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    /* Flower bouquet positioned on the right side */
    .flowers {
      position: absolute;
      left: 70%;
      bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
      z-index: 10;
    }

    /* Delayed Entrance Keyframes */
    @keyframes fadeInSlideUp {
      0% {
        opacity: 0;
        transform: translateY(28px);
        pointer-events: none;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    }

    @keyframes fadeInOverlay {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Background overlay on left side - ultra sheer gradient */
    .login-background {
      position: absolute;
      right: 38%;
      top: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(to right, rgba(1, 1, 19, 0.3) 0%, rgba(1, 1, 19, 0.08) 65%, transparent 100%);
      z-index: 1001;
      pointer-events: none;
      opacity: 0;
      animation: fadeInOverlay 1.5s ease-out 6.5s forwards;
    }

    /* Main Container */
    .login-container {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      gap: clamp(16px, 2.8vh, 26px);
      z-index: 1002;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* Top Header Banner - appears 7 seconds after page load */
    .header {
      text-align: center;
      font-size: clamp(1.35rem, 2.2vw + 0.4rem, 2.3rem);
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.22), rgba(79, 70, 229, 0.15));
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px 24px;
      border-radius: 16px;
      width: 92%;
      max-width: 520px;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      animation: fadeInSlideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 7s forwards;
    }

    /* Crystal Clear Frosted Glass Login Card - appears 8 seconds after page load */
    .login-grandparent {
      position: relative;
      width: 92%;
      max-width: 520px;
      background: rgba(18, 14, 38, 0.25); /* highly transparent to see flowers behind */
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(168, 85, 247, 0.2) inset;
      backdrop-filter: blur(6px); /* light blur so flower stems & leaves clearly show */
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1002;
      color: #f1f5f9;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      animation: fadeInSlideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 8s forwards;
    }

    /* Form Rows */
    .login-parent1,
    .login-parent2,
    .login-parent3,
    .login-parent4 {
      position: relative;
      width: 100%;
    }

    /* Persuasive subtitle */
    .persuasion p {
      font-size: clamp(0.85rem, 1.05vw, 0.95rem);
      color: #e0d7ff;
      line-height: 1.5;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 500;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    }

    /* Field Labels */
    .email-address,
    .password {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    /* Modern Styled Inputs */
    .email-address-input input,
    .password-input input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      outline: none;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    .email-address-input input::placeholder,
    .password-input input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9rem;
    }

    .email-address-input input:focus,
    .password-input input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25), 0 0 16px rgba(168, 85, 247, 0.2);
    }

    /* Sign-in / Sign-up row */
    .sign-in-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .sign-in {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    /* Glowing Primary Button */
    .sign-in-button button {
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(147, 51, 234, 0.45);
      transition: all 0.25s ease;
    }

    .sign-in-button button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(147, 51, 234, 0.65);
      filter: brightness(1.1);
    }

    .sign-in-button button:active {
      transform: translateY(0);
    }

    /* Facebook Social Button */
    .sign-in-with-fb {
      width: 100%;
      padding: 12px 18px;
      background: rgba(24, 119, 242, 0.18);
      border: 1px solid rgba(24, 119, 242, 0.45);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-sizing: border-box;
      margin-top: 4px;
    }

    .sign-in-with-fb:hover {
      background: rgba(24, 119, 242, 0.32);
      border-color: #1877f2;
      box-shadow: 0 4px 18px rgba(24, 119, 242, 0.35);
      transform: translateY(-1px);
    }

    .sign-in-with-fb-text {
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Responsive Phone Layout */
    @media (max-width: 768px) {
      .flowers {
        left: 50%;
        transform: scale(0.75);
      }

      .login-container {
        left: 0;
        right: 0;
        padding: 1.5rem 1rem;
        gap: 16px;
      }

      .header {
        width: 95%;
        max-width: 450px;
        font-size: clamp(1.2rem, 4.8vw, 1.65rem);
        padding: 14px 18px;
      }

      .login-grandparent {
        width: 95%;
        max-width: 450px;
        padding: 22px 20px;
        gap: 14px;
      }

      .login-background {
        left: 0;
        right: 0;
        background: rgba(1, 1, 19, 0.25);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      .sign-in-section {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        gap: 10px;
      }

      .sign-in-button button {
        width: 100%;
        padding: 13px;
      }
    }

  </style>

</head>
