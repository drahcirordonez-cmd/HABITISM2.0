  <style>
    .login-background {
      position: absolute;
      right: 40%;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(241, 240, 255, 0.362);
      z-index: 1001;
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .login-container {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 45%; /* covers left side on desktop */
      display: flex;
      flex-direction: column;
      justify-content: center; /* centers header + form vertically */
      align-items: center;
      padding: 1.5rem;
      gap: clamp(12px, 2.5vh, 25px); /* dynamic spacing that never overlaps */
      z-index: 1002;
    }

    .header {
      text-align: center;
      /* Scaled down slightly so it fits mobile screens without wrapping into 5 lines */
      font-size: clamp(1.25rem, 2.5vw + 0.5rem, 2.2rem);
      color: white;
      background-color: rgba(111, 31, 155, 0.351);
      padding: 12px 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 450px;
      /* Removed top/left/transform absolute positioning */
    }

    .login-grandparent {
      position: relative; /* Now relative inside the flex column */
      width: 90%;
      max-width: 450px;
      /* Controlled height so it scales nicely on both phone and desktop */
      height: clamp(260px, 42vh, 380px);
      background-color: rgba(241, 240, 255, 0);
      z-index: 1002;
    }

    .login-parent1 {
      position: absolute;
      top: 0%;
      width: 100%;
      height: 22%;
      background-color: rgb(26, 15, 177);
      z-index: 1003;
    }

    .login-parent2 {
      position: absolute;
      top: 25%;
      width: 100%;
      height: 22%;
      background-color: rgb(26, 15, 177);
      z-index: 1003;
    }

    .login-parent3 {
      position: absolute;
      bottom: 25%;
      width: 100%;
      height: 22%;
      background-color: rgb(26, 15, 177);
      z-index: 1003;
    }

    .login-parent4 {
      position: absolute;
      bottom: 0%;
      width: 100%;
      height: 22%;
      background-color: rgb(26, 15, 177);
      z-index: 1003;
    }

  </style>

</head>
